<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient></defs><rect width="1200" height="700" fill="url(#bg)"/><text x="60" y="70" font-size="34" font-weight="700" fill="#f8fafc">Domestic Two-Wheeler Dispatches by Type</text><text x="60" y="104" font-size="18" fill="#94a3b8">SIAM, October 2026: units and change vs October 2025</text><text x="212" y="187" font-size="19" font-weight="600" fill="#f8fafc" text-anchor="end">Motorcycles</text><rect x="230" y="160" width="683.09664" height="38" rx="4" fill="#3b82f6"/><text x="925.09664" y="187" font-size="18" font-weight="600" fill="#f8fafc">14,23,118  (+6.6%)</text><text x="212" y="317" font-size="19" font-weight="600" fill="#f8fafc" text-anchor="end">Scooters</text><rect x="230" y="290" width="526.44288" height="38" rx="4" fill="#14b8a6"/><text x="768.44288" y="317" font-size="18" font-weight="600" fill="#f8fafc">10,96,756  (+31.6%)</text><text x="212" y="447" font-size="19" font-weight="600" fill="#f8fafc" text-anchor="end">Mopeds</text><rect x="230" y="420" width="27.80928" height="38" rx="4" fill="#f59e0b"/><text x="269.80928" y="447" font-size="18" font-weight="600" fill="#f8fafc">57,936  (+13%)</text><text x="230" y="590" font-size="18" fill="#cbd5e1">Scooters were 42.5% of domestic two-wheeler dispatches (our calculation).</text><text x="60" y="672" font-size="14" fill="#64748b">Source: SIAM data released 13 Nov 2026. BikeChala analysis.</text><text x="1140" y="672" font-size="14" fill="#94a3b8" text-anchor="end" font-weight="600">BikeChala.com</text></svg>