<text x="40" y="88" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#94a3b8">India launch, 18 Nov 2026. Changes are versus the 765 RS. Source: BikeWale</text>
<line x1="40" x2="860" y1="130" y2="130" stroke="#1e293b"/>
<text x="40" y="160" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#e2e8f0">Power</text>
