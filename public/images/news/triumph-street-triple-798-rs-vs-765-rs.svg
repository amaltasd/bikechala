<text x="300" y="226" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#f59e0b" font-weight="700">+6 Nm</text>
<text x="520" y="226" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#fff">86 Nm at 9,250 rpm</text>
<line x1="40" x2="860" y1="262" y2="262" stroke="#1e293b"/>
<text x="40" y="292" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#e2e8f0">Weight</text>
