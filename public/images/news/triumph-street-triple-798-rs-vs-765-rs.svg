<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-label="Triumph Street Triple 798 RS: 133 bhp, 86 Nm, 183 kg, 5 kg lighter than the 765 RS, Rs 14.39 lakh">
<rect width="100%" height="100%" fill="#0f172a"/>
