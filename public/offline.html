<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ea580c">
  <title>You're offline | BikeChala</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc; color: #0f172a; text-align: center; }
    .card { max-width: 360px; }
    .logo { width: 72px; height: 72px; border-radius: 20px; background: #ea580c; margin: 0 auto 20px;
      display: grid; place-items: center; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: #64748b; line-height: 1.5; font-size: 15px; }
    button { appearance: none; border: 0; background: #ea580c; color: #fff; font-weight: 700; font-size: 16px;
      padding: 14px 28px; border-radius: 14px; min-height: 48px; }
    @media (prefers-color-scheme: dark) { body { background: #020817; color: #f8fafc; } p { color: #94a3b8; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>BikeChala needs a connection to load this page. Pages you opened recently are still available once you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
